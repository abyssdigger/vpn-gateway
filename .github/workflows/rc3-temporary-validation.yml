name: RC3 temporary validation

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile
        run: python -m compileall -q design/RC3/code/python
      - name: Unit tests
        run: python -m unittest discover -s design/RC3/code/python/tests -p 'test_*.py' -v
