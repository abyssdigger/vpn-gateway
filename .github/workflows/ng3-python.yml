  linux-exp049-openvpn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EXP-049 real OpenVPN + systemd onboarding on Debian 13
        run: |
          set -euo pipefail
          docker rm -f ng3-exp049 >/dev/null 2>&1 || true
          trap 'docker rm -f ng3-exp049 >/dev/null 2>&1 || true' EXIT

          docker run -d --name ng3-exp049 --privileged --cgroupns=host \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:13 \
            bash -lc '
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                systemd systemd-sysv dbus \
                python3 iproute2 iputils-ping nftables procps openvpn openssl
              mkdir -p /dev/net
              if [ ! -e /dev/net/tun ]; then
                mknod /dev/net/tun c 10 200
              fi
              exec /sbin/init
            '

          for attempt in $(seq 1 90); do
            if docker exec ng3-exp049 systemctl show-environment >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker logs ng3-exp049
              exit 1
            fi
            sleep 1
          done

          docker exec ng3-exp049 bash -lc '
            set -e
            PYTHONPATH=design/NG3/code/python \
              python3 "design/experiments/EXP-049 NG3 administrator VPN onboarding applicability/exp049_openvpn_onboarding.py"
          '

          docker exec ng3-exp049 bash -lc '
            set -e
            PYTHONPATH=design/NG3/code/python \
              python3 "design/experiments/EXP-050 NG3 bounded VPN lifecycle applicability/exp050_openvpn_systemd_lifecycle.py"
          '

