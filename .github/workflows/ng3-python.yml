name: NG3 Python

on:
  push:
    paths:
      - "design/NG3/code/python/**"
      - ".github/workflows/ng3-python.yml"
      - "design/experiments/EXP-028 NG3 lower policy platform space/**"
  pull_request:
    paths:
      - "design/NG3/code/python/**"
      - ".github/workflows/ng3-python.yml"
      - "design/experiments/EXP-028 NG3 lower policy platform space/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: python3 -m compileall -q design/NG3/code/python/rou
      - name: Unit tests
        env:
          PYTHONPATH: design/NG3/code/python
        run: >-
          python3 -m unittest discover
          -s design/NG3/code/python/rou/tests
          -p 'test_*.py' -v


  linux-route-priority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux networking tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables
      - name: NG3 route-priority Linux integration
        env:
          PYTHONPATH: design/NG3/code/python
        run: >-
          sudo --preserve-env=PYTHONPATH
          python3
          design/NG3/code/python/rou/tests/integration_route_priority_backend.py


  linux-policy-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux policy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables
      - name: EXP-028 lower policy platform space
        run: >-
          sudo python3
          "design/experiments/EXP-028 NG3 lower policy platform space/exp028_lower_policy_space.py"
