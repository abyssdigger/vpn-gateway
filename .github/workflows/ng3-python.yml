name: NG3 Python

on:
  push:
    paths:
      - "design/NG3/code/python/**"
      - ".github/workflows/ng3-python.yml"
      - "design/experiments/EXP-028 NG3 lower policy platform space/**"
      - "design/experiments/EXP-029 NG3 structural routing inventory shape/**"
      - "design/experiments/EXP-030 NG3 managed-netns forwarding barrier/**"
      - "design/experiments/EXP-031 NG3 nft namespace owner marker/**"
      - "design/experiments/EXP-032 NG3 payload nft scaffold/**"
      - "design/experiments/EXP-033 NG3 exact-ifindex payload masquerade/**"
      - "design/experiments/EXP-034 NG3 exact-handle payload NAT reconciliation/**"
      - "design/experiments/EXP-039 NG3 generic TUN transport endpoint provenance/**"
      - "design/experiments/EXP-040 NG3 managed INPUT OUTPUT drop scaffold/**"
      - "design/experiments/EXP-041 NG3 ordered Device firewall child chain/**"
      - "design/experiments/EXP-042 NG3 Device firewall predicate JSON/**"
      - "design/experiments/EXP-043 NG3 Device firewall active reject/**"
      - "design/experiments/EXP-044 NG3 Device firewall jump insertion/**"
      - "design/experiments/EXP-045 NG3 composite Profile forward mutation/**"
      - "design/experiments/EXP-046 NG3 publication local admission/**"
  pull_request:
    paths:
      - "design/NG3/code/python/**"
      - ".github/workflows/ng3-python.yml"
      - "design/experiments/EXP-028 NG3 lower policy platform space/**"
      - "design/experiments/EXP-029 NG3 structural routing inventory shape/**"
      - "design/experiments/EXP-030 NG3 managed-netns forwarding barrier/**"
      - "design/experiments/EXP-031 NG3 nft namespace owner marker/**"
      - "design/experiments/EXP-032 NG3 payload nft scaffold/**"
      - "design/experiments/EXP-033 NG3 exact-ifindex payload masquerade/**"
      - "design/experiments/EXP-034 NG3 exact-handle payload NAT reconciliation/**"
      - "design/experiments/EXP-039 NG3 generic TUN transport endpoint provenance/**"
      - "design/experiments/EXP-040 NG3 managed INPUT OUTPUT drop scaffold/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: python3 -m compileall -q design/NG3/code/python/rou
      - name: Unit tests
        env:
          PYTHONPATH: design/NG3/code/python
        run: >-
          python3 -m unittest discover
          -s design/NG3/code/python/rou/tests
          -p 'test_*.py' -v


  linux-route-priority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux networking tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables
      - name: NG3 route-priority Linux integration
        env:
          PYTHONPATH: design/NG3/code/python
        run: >-
          sudo --preserve-env=PYTHONPATH
          python3
          design/NG3/code/python/rou/tests/integration_route_priority_backend.py


  linux-policy-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux policy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables
      - name: EXP-028 lower policy platform space
