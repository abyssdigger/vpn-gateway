  release-0-1-0-deployment-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate release records and build release assets
        run: |
          set -euo pipefail
          python3 release/0.1.0/qa/validate_release_records.py
          sh release/0.1.0/build-bundle.sh
          sh release/0.1.0/build-project-snapshot.sh
          (
            cd dist
            sha256sum -c vpn-gate-0.1.0.tar.gz.sha256
            sha256sum -c vpn-gate-0.1.0-project-snapshot.tar.gz.sha256
            printf '%s\n' 'RELEASE_ASSET_CHECKSUMS_BEGIN'
            cat vpn-gate-0.1.0.tar.gz.sha256
            cat vpn-gate-0.1.0-project-snapshot.tar.gz.sha256
            printf '%s\n' 'RELEASE_ASSET_CHECKSUMS_END'
          )
      - name: Walk published administrator procedure and run negative QA
        run: |
          set -euo pipefail
          docker rm -f ng3-release-qa >/dev/null 2>&1 || true
          trap 'docker rm -f ng3-release-qa >/dev/null 2>&1 || true' EXIT

          docker run -d --name ng3-release-qa --privileged --cgroupns=host \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v /lib/modules:/lib/modules:ro \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:13 \
            bash -lc '
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                systemd systemd-sysv dbus python3 kmod openssl ocserv
              mkdir -p /dev/net
              if [ ! -e /dev/net/tun ]; then
                mknod /dev/net/tun c 10 200
              fi
              if [ ! -e /dev/ppp ]; then
                mknod /dev/ppp c 108 0
              fi
              modprobe wireguard || true
              modprobe ppp_generic || true
              modprobe pppol2tp || true
              exec /sbin/init
            '

          for attempt in $(seq 1 90); do
            if docker exec ng3-release-qa systemctl show-environment >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker logs ng3-release-qa
              exit 1
            fi
            sleep 1
          done

          docker exec ng3-release-qa bash -lc '
            set -e
            python3 release/0.1.0/qa/release_deployment_qa.py
          '
      - name: Upload validated release candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: vpn-gate-0.1.0-candidate
          path: |
            dist/vpn-gate-0.1.0.tar.gz
            dist/vpn-gate-0.1.0.tar.gz.sha256
            dist/vpn-gate-0.1.0-project-snapshot.tar.gz
            dist/vpn-gate-0.1.0-project-snapshot.tar.gz.sha256
            release/0.1.0/QA-REPORT.md
            release/0.1.0/REQUIREMENTS-COVERAGE.md
            release/0.1.0/RELEASE-SCOPE.md
          if-no-files-found: error
