name: NG2 Python

on:
  push:
    paths:
      - "design/NG2/code/python/**"
      - ".github/workflows/ng2-python.yml"
  pull_request:
    paths:
      - "design/NG2/code/python/**"
      - ".github/workflows/ng2-python.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: python3 -m compileall -q design/NG2/code/python/rou
      - name: Unit tests
        env:
          PYTHONPATH: design/NG2/code/python
        run: >-
          python3 -m unittest discover
          -s design/NG2/code/python/rou/tests
          -p 'test_*.py' -v

  linux-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux networking tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iputils-ping conntrack
      - name: NG2 selective probe-process isolation experiment
        run: >-
          sudo python3
          design/NG2/code/python/rou/tests/integration_probe_process_isolation.py
      - name: NG2 Linux instance lifecycle integration
        env:
          PYTHONPATH: design/NG2/code/python
        run: >-
          sudo --preserve-env=PYTHONPATH
          python3
          design/NG2/code/python/rou/tests/integration_linux_instance.py
      - name: NG2 Linux Adapter integration
        env:
          PYTHONPATH: design/NG2/code/python
        run: >-
          sudo --preserve-env=PYTHONPATH
          python3
          design/NG2/code/python/rou/tests/integration_linux_adapter.py
      - name: NG2 Linux dataplane integration
        env:
          PYTHONPATH: design/NG2/code/python
        run: >-
          sudo --preserve-env=PYTHONPATH
          python3
          design/NG2/code/python/rou/tests/integration_linux_dataplane.py
