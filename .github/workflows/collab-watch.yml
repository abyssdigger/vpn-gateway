name: COLLAB Watch

on:
  push:
    paths:
      - "tools/collab-watch/**"
      - ".github/workflows/collab-watch.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/collab-watch
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -m unittest discover -q

  live-evidence:
    if: github.ref == 'refs/heads/collab-live-evidence-20261126'
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/collab-watch
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify historical semantic baseline
        shell: bash
        run: |
          if ! git cat-file -e '5ea03ac9e0a2114f224ee810a743373ae2669534^{commit}' 2>/dev/null ||
             ! git diff --quiet 5ea03ac9e0a2114f224ee810a743373ae2669534 -- \
               collab_watch.py core.py journal.py preflight_m.py \
               compact_observation.py pilot-config-m1.json preflight_cli.py 2>/dev/null; then
            echo "FAIL stage: historical baseline"
            exit 1
          fi
      - name: Verify exact OPEN candidate
        shell: bash
        run: |
          if ! python -c 'from pathlib import Path; import hashlib; b=Path("d001-open-candidate.txt").read_bytes(); raise SystemExit(0 if len(b)==399 and hashlib.sha256(b).hexdigest()=="96e6011d51ce60786c0020696f388f688f96feb42e5d81306b965f1757d1128f" else 1)' 2>/dev/null; then
            echo "FAIL stage: candidate identity"
            exit 1
          fi
      - name: Fresh D001 OPEN preflight
        env:
          COLLAB_GITHUB_TOKEN: ${{ github.token }}
        run: python preflight_cli.py --config pilot-config-m1.json --actor 340153730 --kind journal --candidate d001-open-candidate.txt --fresh 2>/dev/null
