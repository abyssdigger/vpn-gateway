name: NG1 Python validation

on:
  push:
    branches: [ main, 'code-cycle-*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile NG1 ROU Python tree
        run: python -m compileall -q design/NG1/code/python/rou

      - name: Run NG1 ROU unit tests
        run: python -m unittest discover -s design/NG1/code/python/rou/tests -p 'test_*.py' -v


  kernel-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install kernel networking tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables

      - name: Validate deployment shell and systemd unit
        run: |
          sh -n design/NG1/deploy/install.sh
          sh -n design/NG1/deploy/rou
          sudo install -d -m 0700 /var/lib/vpn-gateway
          sudo install -m 0755 /bin/true /usr/local/sbin/rou
          systemd-analyze verify design/NG1/deploy/rouvpn@.service
          sudo rm -f /usr/local/sbin/rou

      - name: Run disposable-netns instance lifecycle
        run: sudo -E "$(command -v python)" design/NG1/code/python/rou/tests/integration_instance_lifecycle.py

      - name: Run lifecycle route-diff proof with overlapping Profiles
        run: sudo -E "$(command -v python)" design/NG1/code/python/rou/tests/integration_lifecycle_route_diff.py

      - name: Run EXP-017 preliminary numeric-iif proof
        run: sudo sh "design/experiments/EXP-017 NG1 ifindex-aware firewall admission/exp-017-nft-ifindex-ci.sh"

      - name: Run nft policy backend round-trip
        run: sudo -E "$(command -v python)" design/NG1/code/python/rou/tests/integration_nft_policy_roundtrip.py

      - name: Run EXP-016 ECMP hash-policy proof
        run: sudo sh "design/experiments/EXP-016 NG1 ECMP hash policy prerequisite/exp-016-ecmp-hash-ci.sh"

      - name: Run full NG1 production reconcile cycle
        run: sudo -E "$(command -v python)" design/NG1/code/python/rou/tests/integration_production_cycle.py
