# First NG3 alpha configuration example using the canonical Release-1 grammar.
#
# This alpha runtime materializes Device outbound NAT, ordinary Device firewall,
# Device-owned VPN client transport/control allow and publish_vpn_server.
# availability_check and Profile +snat are part of the current alpha path.
# Publication still requires pre-existing host forwarding and any explicit
# host IPv4/interface selector.
#
# Host-routing assistance is disabled by default. Select traffic explicitly:
# ":local", ":external", ":any", or exact ingress names such as "eth0,br0".
log_level = "info"
helper_routing_interfaces = ":none"
helper_routing_policy = "peaceful"

[device.ovpn]
enabled = true
expected_interfaces = ["vpn0"]
use_outbound_nat = false
allow_vpn_client = "udp:11941>203.0.113.10:1194"
# publish_vpn_server = "tcp/eth0:443>8443"

[profile.alpha]
enabled = true
direction = "outbound"
destinations = ["10.253.0.0/24"]
device_order = ["ovpn"]
